spring.application.name=carebridge-spring-api
server.port=${PORT:8080}
server.servlet.context-path=/api/v1
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/carebridge_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=true
spring.jackson.serialization.write-dates-as-timestamps=false
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8085,http://127.0.0.1:8085,http://localhost:8086,http://127.0.0.1:8086}
app.dev-otp=${DEV_OTP:}
